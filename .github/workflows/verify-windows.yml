name: Verify Windows download
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download and install the public x64 build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $qa = Join-Path $env:RUNNER_TEMP 'interview-assistant-qa'
          New-Item -ItemType Directory -Path $qa | Out-Null
          $installer = Join-Path $qa 'setup.exe'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*-win-x64-setup.exe' --output $installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Windows installer' }
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA256) { throw 'Installer checksum differs' }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with code $($process.ExitCode)" }
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter 'MeetingCopilot.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Could not find installed MeetingCopilot.exe' }
          "MC_QA_DIR=$qa" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MC_QA_EXECUTABLE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Windows x64 installer completed successfully'
      - name: Open the installed application and verify the question bank
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:MC_QA_DIR
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the test dependency' }
          @'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { _electron } from 'playwright';
          const profile = join(process.cwd(), 'profile');
          mkdirSync(profile);
          writeFileSync(join(profile, 'settings.json'), JSON.stringify({
            version: 2, onboarding: { schemaVersion: 1, completed: true },
            asr: { backend: 'cloud' },
            ui: { lang: 'zh', autoLaunch: false, hotkeyToggle: '', hotkeyShot: '' },
          }));
          const nonce = randomBytes(32).toString('hex');
          const app = await _electron.launch({
            executablePath: process.env.MC_QA_EXECUTABLE, timeout: 35000,
            env: { ...process.env, MC_USERDATA: profile, MC_SMOKE_NATIVE: '1', MC_SMOKE_NONCE: nonce },
          });
          try {
            const page = await app.firstWindow();
            await page.getByRole('button', { name: '题库', exact: true }).click();
            await page.getByRole('heading', { name: '面试题库', exact: true }).waitFor();
            assert.equal(await page.getByRole('tab').count(), 4);
            await page.getByRole('tab', { name: '后端工程师', exact: true }).click();
            assert.equal(await page.locator('.role-count').textContent(), '8 道题');
            assert.ok(await page.locator('.question-row').count() > 0);
            assert.match(await page.locator('.question-row a').first().getAttribute('href'), /^https:\/\//);
            const events = readFileSync(join(profile, 'smoke-evidence.jsonl'), 'utf8').trim().split('\n').map(line => JSON.parse(line));
            assert.ok(events.some(item => item.nonce === nonce && item.event === 'native-loaded' && item.details.platform === 'win32' && item.details.arch === 'x64'));
            console.log('Verified x64 installation, native ASR runtime loading, four job tabs, backend questions and source links on Windows.');
          } finally {
            await app.close();
          }
          '@ | Set-Content -Encoding utf8 verify.mjs
          node verify.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows app test failed' }
